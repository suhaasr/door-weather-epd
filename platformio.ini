; Door weather display firmware.
; Board: DFRobot FireBeetle 2 ESP32-E. Panel: Waveshare 7.5" V2 (800x480, B/W).

[platformio]
default_envs = firebeetle2_esp32e

[env:firebeetle2_esp32e]
platform = espressif32@6.12.0
board = dfrobot_firebeetle2_esp32e
framework = arduino
monitor_speed = 115200
; WiFiManager + TLS + fonts don't fit the default 1.2 MB app partition.
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  zinggjm/GxEPD2@1.6.9
  adafruit/Adafruit GFX Library@1.12.6
  bblanchon/ArduinoJson@7.4.3
  tzapu/WiFiManager@2.0.17
